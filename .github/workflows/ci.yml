name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: lint

      - name: Install the locked tools
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check --output-format=github .

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: types

      - name: Install the locked tools
        run: uv sync --locked

      - name: Every annotation has to hold
        run: uv run --locked mypy

  test:
    name: ${{ matrix.label }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-26.04, python: "3.11", label: Linux x86_64}
          - {os: ubuntu-26.04, python: "3.12", label: Linux x86_64}
          - {os: ubuntu-26.04, python: "3.13", label: Linux x86_64}
          - {os: ubuntu-26.04, python: "3.14", label: Linux x86_64}
          - {os: ubuntu-26.04, python: "3.15", label: Linux x86_64}
          - {os: ubuntu-24.04-arm, python: "3.15", label: Linux arm64}
          - {os: macos-26-intel, python: "3.15", label: macOS Intel}
          - {os: macos-26, python: "3.15", label: macOS Apple silicon}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: test-${{ matrix.os }}-${{ matrix.python }}
          python-version: ${{ matrix.python }}

      - name: Install the locked tools
        run: uv sync --locked

      - name: Run the suite against nothing but the repository
        run: uv run --locked pytest -q -p no:randomly -W error

  platform:
    name: Installed on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-26.04, label: Linux x86_64}
          - {os: ubuntu-24.04-arm, label: Linux arm64}
          - {os: macos-26-intel, label: macOS Intel}
          - {os: macos-26, label: macOS Apple silicon}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"

      - name: Install it the way a user would
        run: python -m pip install --disable-pip-version-check .

      - name: The command line runs
        run: |
          n64vi --help
          n64vi --version

      - name: It audits, patches and refuses, on a ROM built here
        run: |
          python - <<'CHECK'
          import struct
          import subprocess
          import sys
          from pathlib import Path

          from n64_video_interface import audit, reseal
          from n64_video_interface.checksum import END

          head = bytearray(0x40)
          head[0:4] = b"\x80\x37\x12\x40"
          struct.pack_into(">I", head, 0x04, 0x0000000F)
          head[0x20:0x34] = b"CI SYNTHETIC ROM    "[:20]
          head[0x3B] = ord("N")
          head[0x3C:0x3E] = b"ZZ"
          head[0x3E] = ord("E")
          body = bytearray(bytes(head) + bytes(END + 0x2000 - 0x40))
          entry = struct.pack(
              ">20I",
              0x02000000,
              0x0000311E,
              320,
              0x03E52239,
              525,
              3093,
              0x0C150C15,
              0x006C02EC,
              0x00000200,
              0x00000000,
              *(0x00000280, 0x00000400, 0x002501FF, 0x000E0204, 0x00000002) * 2,
          )
          body[0x2000 : 0x2000 + len(entry)] = entry
          Path("sample.z64").write_bytes(reseal(bytes(body), "6102"))

          def run(*args):
              done = subprocess.run(["n64vi", *args], capture_output=True, text=True)
              print(f"$ n64vi {' '.join(args)}\n{done.stdout}{done.stderr}")
              return done

          if run("audit", "sample.z64").returncode != 0:
              print("::error title=audit failed::")
              sys.exit(1)
          if run("patch", "sample.z64", "--no-aa", "--output", "sharp.z64").returncode != 0:
              print("::error title=patch failed::")
              sys.exit(1)
          if audit(Path("sharp.z64").read_bytes()).antialiasing_on:
              print("::error title=Anti-aliasing survived the patch::")
              sys.exit(1)
          if run("ips", "sample.z64", "--no-aa", "--output", "sharp.ips").returncode != 0:
              print("::error title=ips failed::")
              sys.exit(1)
          if not Path("sharp.ips").read_bytes().startswith(b"PATCH"):
              print("::error title=Not an IPS patch::")
              sys.exit(1)

          Path("plain.z64").write_bytes(bytes(head) + bytes(0x1000))
          refused = run("patch", "plain.z64", "--no-aa", "--output", "never.z64")
          if refused.returncode == 0 or Path("never.z64").exists():
              print("::error title=A refusal wrote a file::")
              sys.exit(1)
          print("audit, patch, ips and the refusal all behaved")
          CHECK
        shell: bash

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: coverage

      - name: Install the locked tools
        run: uv sync --locked

      - name: Coverage must clear the gate in pyproject.toml
        run: uv run --locked pytest -q -p no:randomly --cov --cov-report=term-missing

  distribution:
    name: The wheel carries no game data
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: distribution

      - name: Build it
        run: uv build

      - name: Nothing copyrighted ships
        run: |
          python3 - <<'CHECK'
          import re
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          banned = re.compile(r"\.(z64|v64|n64|rom|aps|ips|zps|hdr|ram|eep|fla|sra|img|dat|png)$", re.I)
          found = [one for one in names if banned.search(one)]
          print(f"{len(names)} files in {wheel.name}")
          if found:
              print(f"::error title=Game data in the wheel::{', '.join(found)}")
              sys.exit(1)
          CHECK
        shell: bash
