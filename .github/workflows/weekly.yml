name: Weekly

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: weekly-${{ matrix.python }}
          python-version: ${{ matrix.python }}

      - name: Formatting, as the newest formatter sees it
        run: uv run --no-dev --with ruff ruff format --check .

      - name: Lint, with whatever rules were added since
        run: uv run --no-dev --with ruff ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: uv run --no-dev --with mypy mypy

      - name: The suite, against nothing but the repository
        run: uv run --no-dev --with pytest pytest -q -p no:randomly -W error
