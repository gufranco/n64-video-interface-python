[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n64-video-interface"
dynamic = ["version"]
description = "Read and edit the video configuration of a Nintendo 64 ROM, resealing the checksum"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
keywords = ["nintendo64", "n64", "video-interface", "anti-aliasing", "dither", "romhacking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[project.scripts]
n64vi = "n64_video_interface.cli:main"

[project.urls]
Source = "https://github.com/gufranco/n64-video-interface-python"
Issues = "https://github.com/gufranco/n64-video-interface-python/issues"

[tool.hatch.version]
path = "src/n64_video_interface/version.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/n64_video_interface"]
# The tests sit beside the code, so they would ship without this.
exclude = ["*_test.py", "conftest.py"]

[tool.hatch.build.targets.sdist]
include = ["src/n64_video_interface", "README.md", "LICENSE.txt", "pyproject.toml"]
exclude = ["**/*.z64", "**/*.v64", "**/*.n64", "**/*.ips", "**/*.aps"]

[tool.pytest.ini_options]
# Tests live beside the code they test, as `<module>_test.py`. pytest already
# collects that name, and it is the one shape that does not collide: a file
# called `<module>.test.py` is imported as `<package>.<module>.test`, which
# turns `<package>.<module>` into a namespace package and shadows the module
# under test with an empty one.
testpaths = ["src"]
addopts = "-q --strict-markers --strict-config"
# So `pytest` works from a clean checkout with no environment set up.
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/n64_video_interface"]
omit = ["*_test.py", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  # The guard hands argv to a function that is itself tested, so there is
  # nothing behind it left to exercise. Importing the module to reach the guard
  # would run the tool rather than test it.
  'if __name__ == "__main__":',
  # A type checking block never runs, by definition. Python 3.14 drops it before
  # coverage can see it and earlier versions do not, so leaving it in would make
  # the gate mean one thing on the newest runtime and another on the oldest.
  'if TYPE_CHECKING:',
  "raise NotImplementedError",
]
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
# Strict, plus the optional error classes the version offers. This code decides
# which bytes of a ROM are rewritten and what the checksum is resealed to, so a
# None or a width crossing a boundary it should not is exactly the class of
# defect worth catching before the bytes are written. The settings live here so
# a local run and CI agree.
strict = true
python_version = "3.11"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["src/n64_video_interface"]
# The tests sit beside the code and build deliberately malformed inputs to
# prove it refuses them, so they hand wrong types in on purpose. Checking them
# strictly would mean annotating a lie. mypy rejects a wildcard inside a module
# component, so the exclusion is by path rather than by module name.
exclude = "(_test|conftest)\\.py$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
"conftest.py" = ["S101"]
