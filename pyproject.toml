[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n64-video-interface"
dynamic = ["version"]
description = "Read and edit the video configuration of a Nintendo 64 ROM, resealing the checksum"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
keywords = ["nintendo64", "n64", "video-interface", "anti-aliasing", "dither", "romhacking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
n64vi = "n64_video_interface.cli:main"

[project.urls]
Source = "https://github.com/gufranco/n64-video-interface-python"
Issues = "https://github.com/gufranco/n64-video-interface-python/issues"

[tool.hatch.version]
path = "src/n64_video_interface/version.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/n64_video_interface"]

[tool.hatch.build.targets.sdist]
include = ["src/n64_video_interface", "tests", "README.md", "LICENSE.txt", "pyproject.toml"]
exclude = ["**/*.z64", "**/*.v64", "**/*.n64", "**/*.ips", "**/*.aps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# So `pytest` works from a clean checkout with no environment set up.
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/n64_video_interface"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
# Strict, plus the optional error classes the version offers. This code decides
# which bytes of a ROM are rewritten and what the checksum is resealed to, so a
# None or a width crossing a boundary it should not is exactly the class of
# defect worth catching before the bytes are written. The settings live here so
# a local run and CI agree.
strict = true
python_version = "3.11"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["src/n64_video_interface"]

[[tool.mypy.overrides]]
# The tests build deliberately malformed inputs to prove the code refuses them,
# so they hand wrong types in on purpose. Checking them strictly would mean
# annotating a lie.
module = "tests.*"
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
